<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文章一键复制</title>
<style>
:root{--red:#DC2626;--ink:#1C1917;--paper:#FAF7F2;--line:#E7E1D8;--mute:#78716C}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--red);padding:12px 16px}
header h1{margin:0 0 6px;font-size:18px}header nav{display:flex;flex-wrap:wrap;gap:6px}
header nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:2px 10px;font-size:13px}
header nav a:hover{border-color:var(--red);color:var(--red)}
main{max-width:880px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);padding:18px 18px 8px;margin:0 0 22px;scroll-margin-top:90px}
.no{color:var(--red);font-weight:800;letter-spacing:2px;font-size:13px}.card h2{margin:0 0 10px;font-size:20px}
.row{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding:10px 0}
.row label{flex:0 0 36px;color:var(--mute);font-size:13px;padding-top:2px}.row p{flex:1;margin:0;word-break:break-all}
.row.main p{color:var(--mute);font-size:13px}.row a{color:var(--red)}
button,.btn{flex:0 0 auto;cursor:pointer;border:1px solid var(--ink);background:#fff;color:var(--ink);font:13px/1 inherit;padding:7px 12px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--red);color:var(--red)}button.red{background:var(--red);border-color:var(--red);color:#fff}
.covers{display:grid;grid-template-columns:2.35fr 1fr;gap:12px;border-top:1px dashed var(--line);padding:12px 0}
figure{margin:0}figure img{width:100%;display:block;border:1px solid var(--line)}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
figcaption span{display:flex;gap:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}#toast.show{opacity:1}
@media (max-width:600px){.covers{grid-template-columns:1fr}.row{flex-wrap:wrap}.row p{flex-basis:calc(100% - 46px)}.row button{margin-left:46px}}
</style></head><body>
<header><h1>文章 · 一键复制</h1><nav><a href="#a0">示例文章</a></nav></header>
<main><section class="card" id="a0">
<div class="no">01</div><h2>示例文章</h2>
<div class="row"><label>标题</label><p id="t0">用 Claude Code 搭一个公众号写作搭档</p><button onclick="copyText('t0')">复制</button></div>
<div class="row"><label>摘要</label><p id="s0">选题、写稿、改稿、配图、排版，一条流水线跑完，人只做判断。</p><button onclick="copyText('s0')">复制</button></div>
<div class="row main"><label>正文</label><p>红白风排版，图片已内嵌。<a href="示例_排版_红白_预览.html" target="_blank">单独打开预览</a></p><button class="red" onclick="copyRich('b0')">复制正文到公众号</button></div>
<template id="b0"><section style="max-width:677px;margin:0 auto;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#374151;line-height:1.75;letter-spacing:0.5px;overflow-x:hidden;"><section style="margin:10px 10px 32px;background:#ffffff;border-radius:12px;box-shadow:0 4px 24px -4px rgba(220,38,38,0.15);padding:28px 24px 22px;overflow:hidden;"><p style="font-size:42px;color:#DC2626;font-weight:900;margin:0;line-height:0.6;"><span leaf="">“</span></p><p style="font-size:16px;font-weight:800;color:#1C1917;margin:12px 0 8px;line-height:1.75;padding-left:4px;"><span leaf="">选题、写稿、改稿、配图、排版，一条流水线跑完，人只做判断。</span></p><p style="text-align:right;font-size:12px;color:#9CA3AF;margin:8px 0 0;letter-spacing:1px;"><span leaf="">—— 你的名字</span></p></section><section style="padding:0 10px;"><p style="margin-bottom:20px;font-size:15px;line-height:1.8;text-align:justify;"><span leaf="">很多人用 AI 写公众号，最后都卡在同一个地方：引言里要标红底的词写出来像 AI，第二个词也一样。</span></p></section><section style="padding:0 10px 32px;"><p style="font-size:14px;color:#9CA3AF;margin:0 0 14px;letter-spacing:1px;"><span leaf="">📌 本文看点</span></p><section style="display:flex;justify-content:space-between;"><section style="flex:1;background:#FEF2F2;border-radius:10px;padding:16px 12px;margin-right:8px;text-align:center;border:1px solid #FEE2E2;"><p style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:12px;font-weight:800;padding:2px 10px;border-radius:4px;margin:0 0 8px;"><span leaf="">01</span></p><p style="font-size:13px;font-weight:700;color:#1C1917;margin:0;"><span leaf="">看点一</span></p></section><section style="flex:1;background:#FEF2F2;border-radius:10px;padding:16px 12px;margin-right:8px;text-align:center;border:1px solid #FEE2E2;"><p style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:12px;font-weight:800;padding:2px 10px;border-radius:4px;margin:0 0 8px;"><span leaf="">02</span></p><p style="font-size:13px;font-weight:700;color:#1C1917;margin:0;"><span leaf="">看点二</span></p></section><section style="flex:1;background:#FEF2F2;border-radius:10px;padding:16px 12px;text-align:center;border:1px solid #FEE2E2;"><p style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:12px;font-weight:800;padding:2px 10px;border-radius:4px;margin:0 0 8px;"><span leaf="">03</span></p><p style="font-size:13px;font-weight:700;color:#1C1917;margin:0;"><span leaf="">看点三</span></p></section></section></section><section style="margin-top:16px;margin-bottom:28px;padding:0 10px;"><section style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #DC2626;"><section style="display:flex;align-items:center;"><span style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:18px;font-weight:900;padding:4px 14px;border-radius:6px;margin-right:14px;line-height:1.3;"><span leaf="">01</span></span><section><p style="font-size:10px;color:#DC2626;font-weight:700;letter-spacing:3px;margin:0 0 2px;text-transform:uppercase;"><span leaf="">INTRO</span></p><h3 style="font-size:18px;font-weight:800;color:#1C1917;margin:0;letter-spacing:0.5px;"><span leaf="">先把“我是谁”写清楚</span></h3></section></section></section><p style="margin-bottom:20px;font-size:15px;line-height:1.8;text-align:justify;"><span leaf="">AI 不认识你。把身份、读者和不能写的东西写进规则文件，它每次开工前都会先读。</span><span style="border-bottom:2px solid #FECACA;font-weight:600;"><span leaf="">正文里要加淡粉下划线的短语一</span></span><span leaf="">，就是这一步最容易被跳过。</span></p></section><section style="padding:0 10px;"><section style="height:1px;background:#FCA5A5;margin:0;"><span leaf=""><br></span></section></section><section style="margin-top:48px;margin-bottom:28px;padding:0 10px;"><section style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #DC2626;"><section style="display:flex;align-items:center;"><span style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:18px;font-weight:900;padding:4px 14px;border-radius:6px;margin-right:14px;line-height:1.3;"><span leaf="">02</span></span><section><p style="font-size:10px;color:#DC2626;font-weight:700;letter-spacing:3px;margin:0 0 2px;text-transform:uppercase;"><span leaf="">STEP</span></p><h3 style="font-size:18px;font-weight:800;color:#1C1917;margin:0;letter-spacing:0.5px;"><span leaf="">用改稿对照喂出你的口吻</span></h3></section></section></section><p style="margin-bottom:20px;font-size:15px;line-height:1.8;text-align:justify;"><span leaf="">每篇都保存 AI 初稿和你的改稿。攒到三五篇，让它逐段对比，把你的改法归纳成规则。</span><span style="border-bottom:2px solid #FECACA;font-weight:600;"><span leaf="">短语二</span></span><span leaf="">会在下一篇自动生效。</span></p></section><section style="padding:0 10px;"><section style="height:1px;background:#FCA5A5;margin:0;"><span leaf=""><br></span></section></section><section style="margin-top:48px;margin-bottom:28px;padding:0 10px;"><section style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #DC2626;"><section style="display:flex;align-items:center;"><span style="display:inline-block;background:#DC2626;color:#FFFFFF;font-size:18px;font-weight:900;padding:4px 14px;border-radius:6px;margin-right:14px;line-height:1.3;"><span leaf="">03</span></span><section><p style="font-size:10px;color:#DC2626;font-weight:700;letter-spacing:3px;margin:0 0 2px;text-transform:uppercase;"><span leaf="">SUMMARY</span></p><h3 style="font-size:18px;font-weight:800;color:#1C1917;margin:0;letter-spacing:0.5px;"><span leaf="">发稿前过一遍检查</span></h3></section></section></section><p style="margin-bottom:20px;font-size:15px;line-height:1.8;text-align:justify;"><span leaf="">标题、摘要、封面、错别字、敏感表述，一张清单逐项打勾，再去后台粘贴。</span></p></section><section style="padding:0 10px;"><section style="text-align:center;margin:0 0 32px;"><section style="display:flex;align-items:center;justify-content:center;"><span style="height:2px;width:60px;background:#DC2626;margin-right:12px;"><span leaf=""><br></span></span><span style="font-size:11px;color:#DC2626;letter-spacing:3px;font-weight:700;"><span leaf="">END</span></span><span style="height:2px;width:60px;background:#DC2626;margin-left:12px;"><span leaf=""><br></span></span></section></section></section><section style="padding:0 10px;"><p style="margin-bottom:20px;font-size:15px;line-height:1.8;text-align:justify;"><span leaf="">我是你的名字，下篇见。</span></p></section></section></template>

<script>
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2400)}
function put(htmlStr,text){var ok=false,ta=document.createElement('textarea'),h=function(e){e.clipboardData.setData('text/plain',text);if(htmlStr)e.clipboardData.setData('text/html',htmlStr);e.preventDefault()};
document.addEventListener('copy',h,{once:true});ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
try{ok=document.execCommand('copy')}catch(e){}ta.remove();document.removeEventListener('copy',h);return ok}
function copyText(id){toast(put(null,document.getElementById(id).textContent)?'已复制':'复制失败，请手动选中复制')}
function copyRich(id){var tpl=document.getElementById(id),d=document.createElement('div');d.appendChild(tpl.content.cloneNode(true));
toast(put(tpl.innerHTML.trim(),d.innerText)?'正文已复制，去公众号编辑器粘贴':'复制失败，请用「单独打开预览」')}
async function copyImg(id){try{var b=await (await fetch(document.getElementById(id).src)).blob();
var png=await new Promise(function(r){var i=new Image();i.onload=function(){var c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);c.toBlob(r,'image/png')};i.src=URL.createObjectURL(b)});
await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);toast('图片已复制')}catch(e){toast('浏览器不让复制图片，点「下载」')}}
